plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.modelforge.nativeeditor'
    compileSdk 35
    ndkVersion '27.0.12077973'

    // TEST-ONLY signer. The whole private key is public in this repository.
    // The production package MUST NEVER use this signer. Decode once into
    // ignored build output so cloning/CI can reproduce the same debug key.
    def encodedDevKey = rootProject.file('signing/model-forge-public-dev.p12.b64')
    def devKeystore = new File(rootProject.buildDir, 'signing/model-forge-public-dev.p12')
    if (!encodedDevKey.isFile()) {
        throw new GradleException('Public development keystore source is missing.')
    }
    devKeystore.parentFile.mkdirs()
    def pinnedBytes = java.util.Base64.getMimeDecoder().decode(
        encodedDevKey.getText('UTF-8'))
    if (!devKeystore.isFile() || !java.util.Arrays.equals(devKeystore.bytes, pinnedBytes)) {
        devKeystore.bytes = pinnedBytes
    }

    signingConfigs {
        publicDev {
            storeFile devKeystore
            storeType 'pkcs12'
            storePassword 'model-forge-dev-only-2026'
            keyAlias 'forge-public-dev'
            keyPassword 'model-forge-dev-only-2026'
        }
    }

    defaultConfig {
        applicationId 'com.modelforge.nativeeditor'
        minSdk 26
        targetSdk 35
        versionCode 14
        versionName '0.9.0-hovercraft-workshop'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror' } }
        manifestPlaceholders = [appLabel: 'Model Forge Native']
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildTypes {
        debug {
            // Dedicated test identity. Installs alongside older APKs and
            // future secret-signed production packages, never replacing them.
            applicationIdSuffix '.dev'
            versionNameSuffix '-public-dev'
            signingConfig signingConfigs.publicDev
            manifestPlaceholders = [appLabel: 'Model Forge DEV']
        }
        release {
            minifyEnabled false
            // A private signing config must be supplied for production later.
            // Never reuse the publicDev signingConfig on a release.
        }
    }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    implementation 'com.google.code.gson:gson:2.10.1'
    testImplementation 'junit:junit:4.13.2'
    implementation 'com.google.android.filament:filament-android:1.69.3'
    implementation 'com.google.android.filament:gltfio-android:1.69.3'
    implementation 'com.google.android.filament:filament-utils-android:1.69.3'
}
