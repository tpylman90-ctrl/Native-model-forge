plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.modelforge.nativeeditor'
    compileSdk 35
    ndkVersion '27.0.12077973'

    defaultConfig {
        applicationId 'com.modelforge.nativeeditor'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '0.3.0-native-project'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { cppFlags '-std=c++17 -Wall -Wextra -Werror' } }
    }
    externalNativeBuild {
        cmake {
            path file('src/main/cpp/CMakeLists.txt')
            version '3.22.1'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
    buildTypes { release { minifyEnabled false } }
    packaging { jniLibs { useLegacyPackaging = true } }
}

dependencies {
    implementation 'com.google.android.filament:filament-android:1.69.3'
    implementation 'com.google.android.filament:gltfio-android:1.69.3'
    implementation 'com.google.android.filament:filament-utils-android:1.69.3'
}
