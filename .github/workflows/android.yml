name: Native Model Forge Android Foundation
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-model-forge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compact CC0 basic-GLB pack generator
        run: |
          python3 tools/generate_forge_basics.py --output /tmp/forge-basics-ci.mfpack
          python3 - <<'PY'
          import json,zipfile
          with zipfile.ZipFile('/tmp/forge-basics-ci.mfpack') as archive:
              manifest=json.loads(archive.read('manifest.json'))
              assert manifest['version']==1
              assert len(manifest['assets'])>=18
              assert len(archive.namelist())==len(manifest['assets'])+1
              assert all(item['license']=='CC0-1.0' for item in manifest['assets'])
          print("COMPRESSED_GLB_PACK: PASS original CC0 models in lazy ZIP")
          PY
      - name: Compile C++17 modeling core independently of Android
        run: |
          cmake -S app/src/main/cpp -B build/native -DCMAKE_BUILD_TYPE=Debug
          cmake --build build/native --parallel 2
          ctest --test-dir build/native --output-on-failure

  android:
    runs-on: ubuntu-latest
    needs: native-geometry
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK, NDK, and CMake
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          yes | "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.0.12077973' 'cmake;3.22.1'
      - name: Compile native Android APK and JNI C++ modeling library
        run: gradle --no-daemon --stacktrace :app:assembleDebug :app:testDebugUnitTest
      - name: Assert Filament initialization order in activity source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('app/src/main/java/com/modelforge/nativeeditor/MainActivity.kt').read_text()
          assert src.index('Utils.init()\n            Gltfio.init()') < src.index('viewer = ModelViewer(')
          print('STARTUP_ORDER: PASS utilities JNI then gltfio before ModelViewer')
          PY
      - name: Guard camera input ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('app/src/main/java/com/modelforge/nativeeditor/MainActivity.kt').read_text()
          upstream = Path('app/src/main/java/com/modelforge/nativeeditor/MainActivity.kt')
          assert 'cameraManipulator = Manipulator.Builder()' in s
          assert 'UiHelper(UiHelper.ContextErrorPolicy.DONT_CHECK), cameraManipulator' in s
          assert 'viewer.onTouchEvent(event)' in s
          assert 'cameraManipulator.grabBegin(' in s
          assert 'cameraManipulator.grabUpdate(' in s
          assert 'cameraManipulator.grabEnd()' in s
          assert s.index('cameraManipulator.update(dt)') < s.index('viewer.render(frameTimeNanos)')
          assert 'cameraManipulator.jumpToBookmark(cameraManipulator.homeBookmark)' in s
          assert not any(line.lstrip().startswith('viewer.camera.lookAt(') for line in s.splitlines())
          print('CAMERA_INPUT: PASS Filament manipulator owns swipe/joystick/zoom and camera state')
          PY
      - name: Guard native document and recovery wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("app/src/main")
          cpp = (root / "cpp/project_bridge.cpp").read_text()
          ui = (root / "java/com/modelforge/nativeeditor/MainActivity.kt").read_text()
          api = (root / "java/com/modelforge/nativeeditor/NativeProject.kt").read_text()
          assert "Document candidate" in cpp and "candidate.clearHistory()" in cpp
          assert "NativeProject.reshape(" in ui and "NativeProject.undo()" in ui
          assert "NativeProject.redo()" in ui and "restoreWorkingShape()" in ui
          assert "AtomicFile(" in ui and "NativeProject.snapshot()" in ui
          assert "external fun currentShape()" in api
          assert "undoHistory" not in ui and "redoHistory" not in ui
          print("NATIVE_DOCUMENT_BRIDGE: PASS")
          PY
      - name: Guard direct top-face handles and orbit input
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path("app/src/main/java/com/modelforge/nativeeditor/MainActivity.kt").read_text()
          assert "private inner class DirectShapeOverlay" in s
          assert "private enum class TopHandleKind" in s
          assert "TopHandleKind.LEAN" in s and "TopHandleKind.WIDTH" in s
          assert "TopHandleKind.LENGTH" in s and "commitDirectShape(next)" in s
          assert "parent.requestDisallowInterceptTouchEvent(true)" in s
          assert "if (dx * dx + dy * dy > dp(44)" in s
          assert "viewer.onTouchEvent(event)" in s
          assert "NativeProject.reshape(" in s and "shapeOverlay.invalidate()" in s
          print("DIRECT_HANDLE_INPUT: PASS edit handles, native shape commit and orbit fall-through")
          PY
      - name: Verify pinned PUBLIC DEV signing identity and package isolation
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          "$SDK/build-tools/35.0.0/apksigner" verify --print-certs "$APK" > /tmp/model-forge-apksigner.txt
          "$SDK/build-tools/35.0.0/aapt" dump badging "$APK" > /tmp/model-forge-badging.txt
          python3 - <<'PY'
          from pathlib import Path
          import re
          sig=Path("/tmp/model-forge-apksigner.txt").read_text()
          badging=Path("/tmp/model-forge-badging.txt").read_text()
          expected="46db533a1104a55efc92e7c384e83c03d8b7ddafa9193817665b776616d02bea"
          match=re.search(r"Signer #1 certificate SHA-256 digest:\s*([0-9a-fA-F]+)",sig)
          assert match, "Cannot find APK signing certificate SHA-256"
          assert match.group(1).lower() == expected, "APK no longer uses the pinned dev signing key"
          assert "package: name='com.modelforge.nativeeditor.dev'" in badging, "DEV package ID missing"
          assert "versionCode='15'" in badging, "DEV versionCode missing"
          assert "Model Forge DEV" in badging, "DEV app label missing"
          print("DEV_SIGNING: PASS same pinned signing certificate, isolated application ID, versionCode and label")
          PY
      - name: Guard face-picking, signed extrusion and project format
        run: |
          python3 - <<'PY'
          from pathlib import Path
          core=Path("app/src/main/cpp/geometry.cpp").read_text()
          doc=Path("app/src/main/cpp/document.cpp").read_text()
          glb=Path("app/src/main/java/com/modelforge/nativeeditor/GlbBuilder.kt").read_text()
          ui=Path("app/src/main/java/com/modelforge/nativeeditor/MainActivity.kt").read_text()
          assert "multiFaceBox(" in core and "faceVertexCount(" in core
          assert "MFORGE_DOC 5" in doc and "setFaceRegion" in doc
          assert "fun fromPacked(packed: FloatArray)" in glb
          assert "private fun pickFace(" in ui and "private inner class FaceSelectionOverlay" in ui
          assert "private fun handleFaceGesture(" in ui and "NativeProject.setFaceRegion(" in ui
          assert "regionOvalButton" in ui and "regionWidthSlider" in ui
          assert "private fun screenFaceUv(" in ui and "drawnArea(" in ui
          assert "fun hitCurveEdge(" in ui and "bendArea(" in ui
          assert "regionCurveButton" in ui and "NativeProject.setFaceRegion(" in ui
          assert "faceDragHandle" in ui and "drawAreaMode" in ui
          assert "ScrollView(this)" in ui and "syncRegionUi(face)" in ui
          assert "if (directShapeMode) shapeOverlay.invalidate()" in ui
          assert "viewer.onTouchEvent(event)" in ui
          print("DRAWN_CURVED_REGIONS: PASS face-local finger draw, curve manipulation and native export")
          PY
      - name: Regress drawn-curved JNI shape-code compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          core = Path("app/src/main/cpp/geometry.cpp").read_text()
          jni = Path("app/src/main/cpp/jni_bridge.cpp").read_text()
          ui = Path("app/src/main/java/com/modelforge/nativeeditor/MainActivity.kt").read_text()
          assert "bool decodeFaceKind(float raw,int& kind) noexcept" in core
          assert "raw>2.f" in core and "raw!=std::trunc(raw)" in core
          assert "forge::decodeFaceKind(kind,decodedKind)" in jni
          assert "f.kind=decodedKind" in jni
          assert "kind>1.f" not in jni
          assert "return true" in ui[ui.index("private fun commitRegion("):ui.index("private fun handleFaceGesture(")]
          assert "if(commitRegion(face,region.copy(kind=2,depth=0f)))" in ui
          print("CURVED_FACE_JNI: PASS valid type 2, failure-aware UI and regression guard")
          PY
      - name: Guard draw-size-curve-pull interaction stages
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path("app/src/main/java/com/modelforge/nativeeditor/MainActivity.kt").read_text()
          assert "private enum class RegionStage { SIZE, CURVE, PULL }" in s
          assert 'regionStageButton = button("NEXT: CURVE")' in s
          assert "RegionStage.SIZE -> RegionStage.CURVE" in s
          assert "RegionStage.CURVE -> RegionStage.PULL" in s
          assert "RegionStage.PULL -> RegionStage.SIZE" in s
          assert "fun hitSizeCorner(" in s and "sizeCornerIndex=corner" in s
          assert "resizeArea(base,anchor,moving)" in s
          assert "sizeOppositeCorner=regionCorners(editable)[(corner+2)%4]" in s
          assert "sizeLiveArea ?: edgeLiveArea" in s
          assert "commitRegion(face,resized)" in s
          assert "regionStage==RegionStage.CURVE" in s
          assert "regionStage==RegionStage.PULL" in s
          assert "regionStage=RegionStage.SIZE" in s[s.index("if(region!=null && dx*dx"): ]
          assert "viewer.onTouchEvent(event)" in s
          print("REGION_SIZE_STAGE: PASS live corner resize, step transitions and camera regression")
          PY
      - name: Guard guided studio, editable projects, native mirror and model report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ui=Path("app/src/main/java/com/modelforge/nativeeditor/MainActivity.kt").read_text()
          native=Path("app/src/main/cpp/document.cpp").read_text()
          bridge=Path("app/src/main/cpp/project_bridge.cpp").read_text()
          tests=Path("app/src/main/cpp/tests/document_test.cpp").read_text()
          assert "private enum class StudioTask" in ui
          for step in ("BASE","SHAPE","DRAW","SIZE","CURVE","PULL","MIRROR","EXPORT"):
              assert step in ui[ui.index("private enum class StudioTask"):ui.index("private var studioActive")]
          for required in ("launchStudioGuide()","performStudioTask()","updateStudioGuide()",
              "requestOpenProject()","requestExportProject()","readEditableProject(uri)",
              "showModelReport()","launchMirrorWizard()","NativeProject.mirrorFaceRegion("):
              assert required in ui, required
          assert "private val openProjectCode = 403" in ui
          assert "private val exportProjectCode = 404" in ui
          assert "MFORGE_DOC " in ui and "1024*1024" in ui
          assert "mirrorFaceRegion(" in native and "validate(*match)" in native
          assert "sourceFace^1" in native and "overwrite" in native
          assert "Java_com_modelforge_nativeeditor_NativeProject_mirrorFaceRegion" in bridge
          assert "MODEL_FORGE_MIRROR: PASS" in tests
          print("STUDIO_FOUNDATION: PASS guided tasks, project roundtrip paths, symmetry and QA")
          PY
      - name: Guard imported GLB component editor and guided import/export
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path("app/src/main/java/com/modelforge/nativeeditor")
          glb=(root/"GlbWorkshop.kt").read_text()
          ui=(root/"MainActivity.kt").read_text()
          test=Path("app/src/test/java/com/modelforge/nativeeditor/GlbWorkshopTest.kt").read_text()
          for label in ("fun parts()","fun previewPart(","fun applyPart(","fun previewNewPart(","fun addPart(",
                        "fun undo()","fun redo()","fun export()"):
              assert label in glb,label
          for label in ("chooseCraftPart()","chooseCraftOperation(part)","showPartAmounts(part",
                        "confirmPartPreview(","chooseCraftAddPart()","undoCraft()","redoCraft()"):
              assert label in ui,label
          assert "craftWorkshop=editor" in ui and "GlbWorkshop.open(bytes)" in ui
          assert "craftDirty=false" in ui and "Save GLB" in ui
          assert "preview-before" not in ui
          assert "Open a hovercraft GLB" in ui
          for marker in ("previewIsNonDestructive","newPanelIsRealGeometry",
                         "animatedNodesAndOutOfRangeTransforms"):
              assert marker in test
          print("CRAFT_EDITOR: PASS imported components, previews, accessory creation and safety guards")
          PY
      - name: Verify lazy GLB library integration and provenance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("app/src/main/java/com/modelforge/nativeeditor/ForgeAssetPack.kt").read_text()
          mesh=Path("app/src/main/java/com/modelforge/nativeeditor/LibraryGlbMesh.kt").read_text()
          ui=Path("app/src/main/java/com/modelforge/nativeeditor/MainActivity.kt").read_text()
          test=Path("app/src/test/java/com/modelforge/nativeeditor/ForgeAssetLibraryTest.kt").read_text()
          assert "ZipFile(file).use" in p
          assert 'getEntry("manifest.json")' in p
          assert "fun selectedGlb(" in p and "digest(bytes)==target.sha256" in p
          assert 'fun read(bytes:ByteArray)' in mesh
          assert "showAssetLibrary()" in ui and "previewLibraryAsset(" in ui
          assert "ForgeAssetPack.installExternal(this,it)" in ui
          assert 'fun blank():GlbWorkshop' in Path("app/src/main/java/com/modelforge/nativeeditor/GlbWorkshop.kt").read_text()
          assert "eachSelectedCompressedGlbDecodesIntoRealNormalsAndVertices" in test
          print("LAZY_GLB_LIBRARY: PASS on-demand extraction, material preservation path and user catalog")
          PY
      - name: Audit APK includes model core, DEX and manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile
          path='app/build/outputs/apk/debug/app-debug.apk'
          with ZipFile(path) as z:
              names=set(z.namelist())
          for lib in ('model_forge_core', 'filament-jni', 'filament-utils-jni', 'gltfio-jni'):
              assert f'lib/arm64-v8a/lib{lib}.so' in names, f'JNI library missing: {lib}'
          assert 'classes.dex' in names, 'Android compiled application missing'
          assert 'AndroidManifest.xml' in names, 'Manifest missing'
          print('MODEL_FORGE_NATIVE_APK: PASS geometry + all Filament JNI layers + DEX + manifest')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: ModelForgeNative-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
